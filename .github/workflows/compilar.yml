
name: Compilar GameMode Santa Group

on:
  workflow_dispatch:
  push:
    paths:
      - 'gamemodes/**'
      - 'pawno/include/**'

jobs:
  compile:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Compilar ASTRA
        uses: ./
        with:
          source: 'gamemodes/astra.pwn'
          include-path: 'pawno/include'
          version: '3.10.10'
          args: '-d3'

      - name: Gerar download AMX
        uses: actions/upload-artifact@v4
        with:
          name: ASTRA-AMX
          path: gamemodes/astra.amx
          if-no-files-found: error
          
